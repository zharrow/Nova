name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Build, tests et typage (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v7

      # La version de pnpm vient de `packageManager` dans le package.json racine.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `novaui#build` dépend de la tâche racine `registry:build` dans
      # turbo.json : le registry est généré avant que la CLI l'embarque, sans
      # qu'on ait à ordonner les étapes ici.
      - run: pnpm build

      # `test` dépend du build du paquet lui-même : sans lui, le test du bundle
      # lit un dist périmé et le garde-fou "use client" passe en silence.
      - run: pnpm test

      - run: pnpm typecheck

  registry:
    name: Registry et CLI
    runs-on: ubuntu-latest

    # Ce job vérifie ce que le dépôt SAIT PRODUIRE, pas ce qu'il publie.
    #
    # Le garde-fou de publication ne laisse sortir que les familles portant
    # `valide: true` dans `apps/docs/lib/catalogue.ts`. Sans cette variable, un
    # registry sans aucune famille validée fait installer zéro composant à
    # l'étape suivante, `novaui add` sans argument sort en erreur, et le job
    # tombe en annonçant « Aucun composant publié » — ce qui est vrai, et n'a
    # rien à voir avec ce qu'on cherche à contrôler ici.
    #
    # Pire, sans elle le contrôle serait VIDE de sens : une famille écrite
    # aujourd'hui et validée dans trois semaines ne serait pas compilée entre
    # les deux, et casserait la CI le jour de sa validation, loin de la main
    # qui l'a écrite. La variable n'est posée que sur ce job.
    env:
      NOVA_REGISTRY_TOUT: "1"

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Explicite, alors que `pnpm build` l'entraînerait de toute façon : le
      # garde-fou de build-registry.ts échoue si un import vers `@nova-ui/*`
      # subsiste après réécriture, et c'est le sujet même de ce job. Le voir
      # échouer sur sa propre ligne vaut mieux que noyé dans un build.
      - run: pnpm registry:build

      - run: pnpm build

      # Ce que la CLI produit réellement chez un utilisateur, compilé pour de
      # bon. Le typecheck du monorepo ne couvre PAS le code copié : c'est ce
      # passage qui a révélé une erreur de typage invisible autrement.
      - name: Compiler le code copié par la CLI
        run: |
          set -euo pipefail
          projet="$RUNNER_TEMP/consommateur"
          mkdir -p "$projet/src"
          cd "$projet"

          cat > package.json <<'JSON'
          { "name": "consommateur", "private": true, "type": "module" }
          JSON

          # Pas de `baseUrl` : TypeScript 6 l'a supprimée, et `paths` se
          # résout relativement au tsconfig sans elle.
          cat > tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2022",
              "lib": ["ES2022", "DOM", "DOM.Iterable"],
              "module": "ESNext",
              "moduleResolution": "bundler",
              "jsx": "react-jsx",
              "strict": true,
              "noEmit": true,
              "skipLibCheck": true,
              "paths": { "@/*": ["./src/*"] }
            },
            "include": ["src"]
          }
          JSON

          cli="$GITHUB_WORKSPACE/packages/cli/dist/index.js"
          node "$cli" init --yes --cwd "$projet"

          # Tout le catalogue, pour que la compilation couvre chaque moteur.
          # `NOVA_REGISTRY_TOUT` (posé sur le job) lève le garde-fou de
          # publication : la liste contient donc les familles en attente.
          composants=$(node -e "
            const r = require('$GITHUB_WORKSPACE/registry/dist/index.json');
            console.log(r.items.map((c) => c.name).join(' '));
          ")
          echo "Composants installés : $composants"

          # Une liste vide voudrait dire qu'aucune famille n'est DÉCLARÉE, pas
          # qu'aucune n'est publiée — le manifeste serait vide. C'est une
          # erreur, pas un cas de repos : le dire ici évite de la lire comme
          # « Aucun composant publié », qui enverrait chercher au mauvais
          # endroit.
          if [ -z "$composants" ]; then
            echo "registry/dist/index.json ne contient aucun composant :" \
                 "registry.json est vide, ou NOVA_REGISTRY_TOUT n'a pas pris." >&2
            exit 1
          fi

          # `--yes` : sans lui, `add` demande confirmation avant d'installer
          # gsap, lenis et radix-ui, et le job resterait bloqué.
          node "$cli" add $composants --yes --cwd "$projet"

          # La CLI a déjà installé les dépendances des composants. Restent
          # celles que tout projet React apporte de son côté.
          npm install --no-audit --no-fund \
            typescript react react-dom @types/react @types/react-dom

          npx tsc --noEmit
